server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /gateway-health {
        proxy_pass http://api-gateway:8080/health;
        proxy_set_header Host $host;
    }

    location = /version {
        proxy_pass http://api-gateway:8080/version;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://api-gateway:8080/api-docs;
        proxy_set_header Host $host;
    }

    # Page protection: nginx asks auth-service (via the gateway) whether the
    # session cookie may see the page. 401 -> sign-in page, 403 -> no access.
    location = /_auth/docs {
        internal;
        proxy_pass http://api-gateway:8080/api/auth/authorize/docs;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /_auth/admin {
        internal;
        proxy_pass http://api-gateway:8080/api/auth/authorize/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @docs_login  { return 302 /login?next=/docs; }
    location @docs_denied { return 302 /login?denied=docs; }
    location @admin_login { return 302 /login?next=/admin; }
    location @admin_denied { return 302 /; }

    location = /admin {
        auth_request /_auth/admin;
        error_page 401 = @admin_login;
        error_page 403 = @admin_denied;
        add_header Cache-Control "no-store";
        try_files /admin.html =404;
    }

    # Don't let the protected pages be fetched by their file names.
    location = /docs.html  { return 301 /docs; }
    location = /admin.html { return 301 /admin; }

    location = /login {
        try_files /login.html =404;
    }

    location = /docs {
        auth_request /_auth/docs;
        error_page 401 = @docs_login;
        error_page 403 = @docs_denied;
        add_header Cache-Control "no-store";
        try_files /docs.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
