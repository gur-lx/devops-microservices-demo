version: "3.9"

# Production/deployment server: pulls prebuilt images from the registry
# instead of building from source. This is what Jenkins copies over
# and runs on the deployment server.
services:
  api-gateway:
    image: ${REGISTRY}/api-gateway:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    depends_on:
      - user-service
      - product-service
    networks:
      - app-net
    restart: unless-stopped

  user-service:
    image: ${REGISTRY}/user-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  product-service:
    image: ${REGISTRY}/product-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
