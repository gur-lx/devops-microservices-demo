# Production/deployment server: pulls prebuilt images from the registry
# instead of building from source. This is what Jenkins copies over
# and runs on the deployment server.
#
# Load-balanced mode (the default): the frontend is published on host port
# APP_PORT (8090) as plain HTTP, and the nginx load balancer on the Jenkins
# box terminates TLS for learning.run.place and spreads traffic across every
# web server -- see ci/reverse-proxy/conf.d/learning.run.place.conf.example.
#
# Standalone mode (COMPOSE_PROFILES=standalone-tls): additionally runs
# nginx-proxy + acme-companion on 80/443, driven entirely by the
# VIRTUAL_HOST / LETSENCRYPT_HOST env on the frontend below, so this one
# server serves DOMAIN over HTTPS by itself. Only for a server that DNS
# points at directly. Set DOMAIN and LETSENCRYPT_EMAIL as env vars before
# `up`, e.g.: export DOMAIN=learning.run.place LETSENCRYPT_EMAIL=you@example.com
services:
  nginx-proxy:
    profiles: ["standalone-tls"]
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - app-net
    restart: unless-stopped

  acme-companion:
    profiles: ["standalone-tls"]
    image: nginxproxy/acme-companion:latest
    container_name: acme-companion
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    depends_on:
      - api-gateway
    networks:
      - app-net
    restart: unless-stopped

  api-gateway:
    image: ${REGISTRY}/api-gateway:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    environment:
      - BUILD_VERSION=${IMAGE_TAG:-dev}
      - BUILD_DOMAIN=${DOMAIN:-}
      - BUILD_SERVER=${SERVER_NAME:-}
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - CART_SERVICE_URL=http://cart-service:3004
      - INVENTORY_SERVICE_URL=http://inventory-service:3005
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
      - REVIEW_SERVICE_URL=http://review-service:3008
      - AUTH_SERVICE_URL=http://auth-service:3009
      - SHIPPING_SERVICE_URL=http://shipping-service:3010
      - SEARCH_SERVICE_URL=http://search-service:3011
      - ANALYTICS_SERVICE_URL=http://analytics-service:3012
    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service
      - inventory-service
      - payment-service
      - notification-service
      - review-service
      - auth-service
      - shipping-service
      - search-service
      - analytics-service
    networks:
      - app-net
    restart: unless-stopped

  user-service:
    image: ${REGISTRY}/user-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  product-service:
    image: ${REGISTRY}/product-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  order-service:
    image: ${REGISTRY}/order-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  cart-service:
    image: ${REGISTRY}/cart-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  inventory-service:
    image: ${REGISTRY}/inventory-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  payment-service:
    image: ${REGISTRY}/payment-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  notification-service:
    image: ${REGISTRY}/notification-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  review-service:
    image: ${REGISTRY}/review-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  # Login portal database. AUTH_DB_PASSWORD, JWT_SECRET and ADMIN_PASSWORD must be set in
  # the .env file next to this compose file on the server (never in git).
  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=authdb
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-net
    restart: unless-stopped

  auth-service:
    image: ${REGISTRY}/auth-service:${IMAGE_TAG:-latest}
    environment:
      - PGHOST=auth-db
      - PGDATABASE=authdb
      - PGUSER=auth
      - PGPASSWORD=${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@${DOMAIN:-localhost.localdomain}}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  shipping-service:
    image: ${REGISTRY}/shipping-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  search-service:
    image: ${REGISTRY}/search-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

  analytics-service:
    image: ${REGISTRY}/analytics-service:${IMAGE_TAG:-latest}
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  certs:
  vhost:
  html:
  acme:
  auth-db-data:
