# Local development: builds each service from source.
services:
  frontend:
    build: ./services/frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - app-net

  api-gateway:
    build: ./services/api-gateway
    expose:
      - "8080"
    environment:
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    depends_on:
      - user-service
      - product-service
    networks:
      - app-net

  user-service:
    build: ./services/user-service
    networks:
      - app-net

  product-service:
    build: ./services/product-service
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
