---
deploy_user: deployer
deploy_path: /opt/devops-microservices-demo
jenkins_home_volume: jenkins_home
jenkins_ui_port: 8081
registry: docker.io/gurlx
image_tag: latest

# Daily S3 backup (playbook-backup.yml)
backup_s3_bucket: "my-app-backups-1"
backup_s3_prefix: backups
backup_cron_hour: "7"           # server time (UTC on EC2 by default)
backup_cron_minute: "0"
backup_local_keep_days: 3
backup_sns_topic_arn: "arn:aws:sns:us-east-1:905221883480:backup-alerts"
