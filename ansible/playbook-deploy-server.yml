---
# Runs on the managed node (deploy target).
# Installs Docker, creates a dedicated non-root deploy user, authorizes
# Jenkins' SSH key for that user, and drops the prod compose file + .env
# into place so Jenkins can later `scp` an updated compose file and
# `ssh ... docker compose pull && up -d`.
- hosts: deploy_server
  become: true
  vars_files:
    - vars.yml

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Check if Docker is already installed
      command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker via get.docker.com
      shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true

    - name: Ensure deploy user's .ssh directory exists
      file:
        path: "/home/{{ deploy_user }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Authorize Jenkins' public key for the deploy user
      authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', 'files/jenkins_deploy_key.pub') }}"
      # `files/jenkins_deploy_key.pub` is generated by playbook-jenkins.yml
      # on the head node and fetched here — see ansible/README.md for the
      # exact order of operations.

    - name: Create the app deploy directory
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Copy production docker-compose file
      copy:
        src: ../docker-compose.prod.yml
        dest: "{{ deploy_path }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Write .env for docker compose
      template:
        src: templates/env.j2
        dest: "{{ deploy_path }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
