# Merge these two groups into your EXISTING inventory (don't replace it) --
# just add these group headers pointing at hosts/aliases you already have.
#
# jenkins_server = the head EC2 you SSH into (also your Ansible control node).
#   Since Ansible is already running ON this box, target it with the local
#   connection plugin instead of SSH-ing to itself.
#
# deploy_server = the managed node you already provisioned Ansible access to.
#   Reuse whatever alias/IP and ansible_user you already use for it.

[jenkins_server]
head ansible_connection=local

[deploy_server]
managed-node ansible_host=<MANAGED_NODE_PRIVATE_OR_PUBLIC_IP> ansible_user=<your-existing-ssh-user>

[jenkins_server:vars]
ansible_python_interpreter=/usr/bin/python3

[deploy_server:vars]
ansible_python_interpreter=/usr/bin/python3

# lb_web_servers = extra web servers for the load-balanced job
#   (multi-server/Jenkinsfile). Prepared with:
#     ansible-playbook playbook-deploy-server.yml -e @../multi-server/ansible-vars.yml
#   server-1 (184.193.151.24) was set up by hand with the `ubuntu` user, so
#   it's not listed -- see multi-server/README.md.
#     server-2 = the Jenkins box itself (local connection, same as `head`)
#     server-3 = the extra EC2
[lb_web_servers]
server-2 ansible_connection=local
server-3 ansible_host=<SERVER_3_PRIVATE_OR_PUBLIC_IP> ansible_user=ubuntu

[lb_web_servers:vars]
ansible_python_interpreter=/usr/bin/python3
