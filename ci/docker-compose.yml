# Runs on Server A (the Jenkins/CI box). Consolidates the ad-hoc `docker run`
# commands used to set up Jenkins + SonarQube + its Postgres DB into one
# compose file, with explicit memory ceilings on each container.
#
# Sized for the resized box: 3.7GB RAM + 4GB swap (~7.7GB total). Limits
# below sum to well under that, leaving real slack for the OS.
#
# The `jenkins` limit specifically has to cover more than Jenkins' own JVM
# -- every `sh` pipeline step (docker build, sonar-scanner, etc.) runs as a
# child process INSIDE this same container/cgroup, so its budget needs
# headroom for whatever the busiest concurrent build step needs, not just
# Jenkins itself. The old 500m (sized for the pre-resize 1GB box) OOM'd
# the sonar-scanner subprocess mid-analysis for exactly this reason.
#
# IMPORTANT -- what this does and doesn't fix:
# Jenkins + SonarQube + Postgres together want more real RAM than this box
# has, even with swap added (SonarQube alone runs 3 JVMs: web, compute
# engine, and an embedded Elasticsearch). mem_limit/memswap_limit don't
# create more RAM -- they mean that if one container tries to exceed its
# own budget, THAT container gets OOM-killed and restarts on its own
# (restart: unless-stopped), instead of the kernel picking an arbitrary
# victim process on the whole host (which is what happened before -- it
# killed Jenkins' own JVM directly, mid-build). Contained, recoverable
# failures instead of host-wide chaos -- not a substitute for more RAM,
# and swap is disk-backed, so expect things to feel slow whenever a
# container is actually leaning on it.
#
# Volumes below are marked `external: true` because they already exist
# from the original `docker run -v <name>:...` commands -- this reuses
# that existing data (Jenkins jobs/credentials, SonarQube's DB) instead of
# silently creating new empty volumes with a Compose-prefixed name.
services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    group_add:
      - "109"   # docker group GID on the host -- confirm with: getent group docker
    mem_limit: 2000m
    memswap_limit: 3200m
    restart: unless-stopped
    networks:
      - ci-net

  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    mem_limit: 200m
    memswap_limit: 400m
    restart: unless-stopped
    networks:
      - ci-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      # Served at jenkins.run.place/sonar/ via the reverse-proxy below --
      # this tells SonarQube to generate all its own links/assets under
      # that path instead of assuming it owns the domain root.
      - SONAR_WEB_CONTEXT=/sonar
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 4096
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    mem_limit: 2000m
    memswap_limit: 3000m
    restart: unless-stopped
    networks:
      - ci-net

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    mem_limit: 100m
    memswap_limit: 200m
    restart: unless-stopped
    networks:
      - ci-net

  # Renews the cert twice a day (only actually renews within ~30 days of
  # expiry; harmless the rest of the time). Does NOT obtain the first
  # cert -- that's a one-off manual step, see ci/reverse-proxy/README.md.
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait; done"
    mem_limit: 100m
    memswap_limit: 200m
    restart: unless-stopped

networks:
  ci-net:
    driver: bridge

volumes:
  jenkins_home:
    external: true
  sonar_db_data:
    external: true
  sonarqube_data:
    external: true
  sonarqube_extensions:
    external: true
  sonarqube_logs:
    external: true
  certbot_conf:
  certbot_webroot:
