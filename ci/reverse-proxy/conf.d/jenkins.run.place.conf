# Single domain (jenkins.run.place), path-based routing to two backends:
#   /       -> Jenkins   (jenkins:8080)
#   /sonar/ -> SonarQube (sonarqube:9000, with SONAR_WEB_CONTEXT=/sonar)
#
# Bootstrap note: this file references a cert that must already exist at
# /etc/letsencrypt/live/jenkins.run.place/ before nginx can start (a dummy
# self-signed one is fine for the first boot -- see ci/reverse-proxy/README.md
# for the exact bootstrap sequence to get a real cert via certbot).

server {
    listen 80;
    server_name jenkins.run.place;

    # Let's Encrypt HTTP-01 challenge -- must stay plain HTTP, not redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jenkins.run.place;

    ssl_certificate     /etc/letsencrypt/live/jenkins.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.run.place/privkey.pem;

    # Docker's embedded DNS -- combined with variables in proxy_pass below,
    # this makes nginx resolve jenkins/sonarqube at REQUEST time instead of
    # at startup. Without this, nginx refuses to even start if either
    # container isn't already up and resolvable the moment this container
    # boots (e.g. after a host reboot, depending on start order).
    resolver 127.0.0.11 valid=30s;

    # Jenkins recommends these specifically for reverse proxies -- without
    # them, the crumb/CSRF check and agent websocket connections misbehave.
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_redirect          http:// https://;
    proxy_connect_timeout   90s;
    proxy_send_timeout      90s;
    proxy_read_timeout      90s;
    client_max_body_size    100m;

    location = /sonar {
        return 301 /sonar/;
    }

    location /sonar/ {
        set $sonar_upstream http://sonarqube:9000;
        proxy_pass $sonar_upstream;
    }

    location / {
        set $jenkins_upstream http://jenkins:8080;
        proxy_pass $jenkins_upstream;
        # Jenkins agent websocket connections (needed for the "Configure
        # Clouds" / inbound agent path -- harmless to keep even if unused).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
